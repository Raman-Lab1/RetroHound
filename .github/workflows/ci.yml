# Typecheck, tests and the bundled CLI on Linux and macOS arm64, under the oldest supported Node and the current one.
# tests/smoke.test.ts runs dist/cli.mjs with the `node` on PATH, so the matrix node is what gets smoke-tested.
name: ci
on:
  push:
    branches: [main, "phase*", "wave*", collectors]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest runs on arm64; macos-14 is retired
        node: ["22.13.0", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: bundled CLI under Node prints nothing on stderr
        run: |
          node --version
          node dist/cli.mjs --version 2> stderr.txt
          node dist/cli.mjs scan --root fixtures/redacted --db "$RUNNER_TEMP/i.db" --format json > /dev/null 2>> stderr.txt
          cat stderr.txt
          test ! -s stderr.txt
