# RetroHound findings: `retrohound scan --format ndjson-ecs`, one JSON object per line, `@timestamp` first.
# Put on the indexer or heavy forwarder that parses the data (event breaking and timestamps happen there) and on the
# search head (KV_MODE is search time); a universal forwarder needs only inputs.conf.
[retrohound:ecs]
description = RetroHound findings (ECS 9.1.0 NDJSON, one finding per line)
category = Structured
# NDJSON: every line is one event.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# Command lines and messages are masked and short, but a finding with long paths can pass the 10000-byte default.
TRUNCATE = 100000
# The event time is the finding's primary event, ISO-8601 UTC: 2026-11-04T09:05:12.982Z (Claude Code, Codex) or
# 2026-11-04T09:05:12Z (Antigravity, second precision). TIME_FORMAT is left unset on purpose: one strptime format
# cannot match both, and Splunk's automatic recognition reads either right after TIME_PREFIX.
TIME_PREFIX = ^\{"@timestamp":"
MAX_TIMESTAMP_LOOKAHEAD = 32
# Fields are extracted at search time; do not also set INDEXED_EXTRACTIONS = json (that extracts them twice).
KV_MODE = json
