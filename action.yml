name: RetroHound
description: Check a repo's AI coding agent surface (preflight) or agent transcripts (scan) with Sigma rules, offline.
author: Raman Kumar
branding:
  icon: shield
  color: purple
inputs:
  command:
    description: "preflight (the checked-out repo's .claude, .mcp.json, CLAUDE.md, tasks, npm scripts) or scan (transcripts)"
    required: false
    default: preflight
  fail-on:
    description: "Fail the step when a finding is at or above this level: informational, low, medium, high, critical. Empty: never fail on findings."
    required: false
    default: high
  args:
    description: "Extra arguments, split on spaces. preflight: the directory (default .), --format json. scan: --root, --format sarif, ... Do not pass untrusted text here."
    required: false
    default: ""
  output:
    description: "Write RetroHound's report to this file instead of the log (for example rh.sarif with args --format sarif)."
    required: false
    default: ""
outputs:
  exit-code:
    description: "RetroHound's exit code: 0 ok, 1 findings at or above fail-on, 2 bad input, 3 runtime failure."
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: "24"
    - id: run
      shell: bash
      env:
        RH_COMMAND: ${{ inputs.command }}
        RH_FAIL_ON: ${{ inputs.fail-on }}
        RH_ARGS: ${{ inputs.args }}
        RH_OUTPUT: ${{ inputs.output }}
      run: |
        case "$RH_COMMAND" in preflight|scan) ;; *) echo "::error::command must be preflight or scan"; exit 2 ;; esac
        set -- "$RH_COMMAND"
        [ -n "$RH_FAIL_ON" ] && set -- "$@" --fail-on "$RH_FAIL_ON"
        [ "$RH_COMMAND" = scan ] && set -- "$@" --no-index
        # word splitting on purpose: args is a list of flags
        # shellcheck disable=SC2086
        set -f; set -- "$@" $RH_ARGS; set +f
        # npm reads the .npmrc of its working directory, and in the checkout that file is the reviewed repo's
        # (node-options, registry): install from $RUNNER_TEMP, then run the CLI with plain node in the workspace.
        rh="$RUNNER_TEMP/retrohound"
        (cd "$RUNNER_TEMP" && npm install --prefix "$rh" --no-save --no-audit --no-fund --ignore-scripts retrohound@0.3.0 >&2) ||
          { echo "::error::could not install retrohound"; echo "exit-code=3" >> "$GITHUB_OUTPUT"; exit 3; }
        code=0
        if [ -n "$RH_OUTPUT" ]; then node "$rh/node_modules/retrohound/dist/cli.mjs" "$@" > "$RH_OUTPUT" || code=$?
        else node "$rh/node_modules/retrohound/dist/cli.mjs" "$@" || code=$?; fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
