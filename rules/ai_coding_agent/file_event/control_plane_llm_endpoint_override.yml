title: LLM endpoint override to a non-vendor, non-loopback host written to a file
id: 0cd85cbe-888e-4328-8cf9-84dfc6031101
name: control_plane_llm_endpoint_override
author: Raman Kumar
status: experimental
description: >-
  ANTHROPIC_BASE_URL, OPENAI_BASE_URL or a `*_API_BASE` variable is set to an http(s) URL in a file the agent wrote
  (a settings `env` block, a .env, code, a Dockerfile, a manifest). API requests then carry the key to that host (CVE-2026-21852 shape). Writes that
  set it to api.anthropic.com, api.openai.com, a loopback host or host.docker.internal are excluded, and so are
  Markdown files and YAML files holding detection rules (`detection:`), which quote the pattern as text. Shell
  commands are control_plane_llm_endpoint_command.
tags:
  - attack.credential_access
  - attack.t1528
  - attack.t1557
  - owasp_agentic.asi03
  - owasp_agentic.asi04
logsource:
  product: ai_coding_agent
  category: file_event
detection:
  selection_set:
    - content|re|i: &override '(?:anthropic_base_url|openai_base_url|[a-z0-9]{2,20}_api_base)[\\\x22\x27\]]{0,3}(?:\s{0,3}[|&?]{0,2}[=:,]|\s)\s{0,3}[\\\x22\x27]{0,3}https?://'
    - tool_input|re|i: *override
  # Main's looser form (a Kubernetes `- name: X` / `value: url` pair, any other shape); its own filter is main's too.
  selection_loose:
    - content|contains: &override_text
        - anthropic_base_url*http://
        - anthropic_base_url*https://
        - openai_base_url*http://
        - openai_base_url*https://
        - _api_base*http://
        - _api_base*https://
    - tool_input|contains: *override_text
  filter_ok_loose:
    - content|contains: &ok_text [api.anthropic.com, api.openai.com, localhost, 127.0.0.1, '[::1]', host.docker.internal]
    - tool_input|contains: *ok_text
  # The vendor or loopback host must be the value's own host, so a second word (`# localhost`) does not exempt it, and
  # neither does userinfo (`https://localhost:1@example.invalid` goes to example.invalid).
  # Only content is checked: an Edit's tool_input also holds the old_string it replaces.
  filter_ok:
    content|re|i: &ok '(?:anthropic_base_url|openai_base_url|[a-z0-9]{2,20}_api_base)[\\\x22\x27\]]{0,3}(?:\s{0,3}[|&?]{0,2}[=:,]|\s)\s{0,3}[\\\x22\x27]{0,3}https?://(?:localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|\[::1\]|host\.docker\.internal|api\.anthropic\.com|api\.openai\.com)(?::\d{1,5})?(?:$|[/\s\\\x22\x27;&|)])'
  filter_doc:
    - target_path|endswith: ['.md', '.mdx']
    - target_path|endswith: ['.yml', '.yaml']
      content|contains: 'detection:'
    - target_path|endswith: ['.yml', '.yaml']
      tool_input|contains: 'detection:'
  condition: ((selection_set and not filter_ok) or (selection_loose and not selection_set and not filter_ok_loose)) and not filter_doc
falsepositives:
  - Corporate gateways, LiteLLM, Bedrock or Vertex proxies; allowlist the host
  - A local proxy on a LAN address
  - A CI workflow or compose file (.yml) that sets the variable is reported unless it also holds a `detection:` block
level: high
x-retrohound:
  lane: enforce
---
title: LLM endpoint override to a non-vendor, non-loopback host in a shell command
id: 3e9b7c14-5a82-4d06-b1f3-c8d2a6e70419
name: control_plane_llm_endpoint_command
author: Raman Kumar
status: experimental
description: >-
  ANTHROPIC_BASE_URL, OPENAI_BASE_URL or a `*_API_BASE` variable is set to an http(s) URL in a shell command. API
  requests then carry the key to that host (CVE-2026-21852 shape). A heredoc body that cat or tee writes to a file
  (`cat > .env <<'EOF'`) is read from content, where the collector moves it; a lone heredoc that cat or tee writes to
  a Markdown file, or to YAML holding `detection:`, is skipped there, as in control_plane_llm_endpoint_override. Settings to api.anthropic.com,
  api.openai.com, a loopback host or host.docker.internal are excluded; that host must be the URL's own host.
tags:
  - attack.credential_access
  - attack.t1528
  - attack.t1557
  - owasp_agentic.asi03
  - owasp_agentic.asi04
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_set:
    command_line|re|i: &override_cmd '(?:anthropic_base_url|openai_base_url|[a-z0-9]{2,20}_api_base)[\\\x22\x27\]]{0,3}(?:\s{0,3}[|&?]{0,2}[=:,]|\s)\s{0,3}[\\\x22\x27]{0,3}https?://'
  filter_ok:
    command_line|re|i: &ok_cmd '(?:anthropic_base_url|openai_base_url|[a-z0-9]{2,20}_api_base)[\\\x22\x27\]]{0,3}(?:\s{0,3}[|&?]{0,2}[=:,]|\s)\s{0,3}[\\\x22\x27]{0,3}https?://(?:localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|\[::1\]|host\.docker\.internal|api\.anthropic\.com|api\.openai\.com)(?::\d{1,5})?(?:$|[/\s\\\x22\x27;&|)])'
  # A heredoc body stored by cat or tee (`cat > .env <<'EOF'`) is in content, not command_line.
  selection_body:
    command_line|re|i: '(?:^|[;&|\n]\s{0,5})(?:cat|tee)\b[^\n]{0,300}<<'
    content|re|i: *override_cmd
  filter_body:
    content|re|i: *ok_cmd
  # The body is document text only when cat or tee writes it to that .md file (or a .yml holding `detection:`), and
  # that heredoc is the line's only one: two bodies share one content field.
  filter_doc:
    - command_line|re|i: '(?:^|[;&|\n]\s{0,5})(?:cat\s{0,5}>{1,2}\s{0,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.mdx?[\x22\x27]?\s{0,3}<<|cat\s{1,5}<<-?\s{0,3}[\x22\x27]?\w{1,40}[\x22\x27]?\s{0,3}>{1,2}\s{0,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.mdx?[\x22\x27]?(?:$|[\s;&|)])|tee(?:\s{1,3}-a)?\s{1,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.mdx?[\x22\x27]?(?:\s{1,3}>\s{0,3}/dev/null)?\s{0,3}<<)'
    - command_line|re|i: '(?:^|[;&|\n]\s{0,5})(?:cat\s{0,5}>{1,2}\s{0,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.ya?ml[\x22\x27]?\s{0,3}<<|cat\s{1,5}<<-?\s{0,3}[\x22\x27]?\w{1,40}[\x22\x27]?\s{0,3}>{1,2}\s{0,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.ya?ml[\x22\x27]?(?:$|[\s;&|)])|tee(?:\s{1,3}-a)?\s{1,3}[\x22\x27]?[^\s;&|<>\x22\x27]{1,200}\.ya?ml[\x22\x27]?(?:\s{1,3}>\s{0,3}/dev/null)?\s{0,3}<<)'
      content|contains: 'detection:'
  multi_heredoc:
    command_line|re: '<<(?:[^<]|<[^<]){0,20000}<<'
  condition: (selection_set and not filter_ok) or (selection_body and not filter_body and not (filter_doc and not multi_heredoc))
falsepositives:
  - Corporate gateways, LiteLLM, Bedrock or Vertex proxies; allowlist the host
  - A local proxy on a LAN address
level: high
x-retrohound:
  lane: enforce
