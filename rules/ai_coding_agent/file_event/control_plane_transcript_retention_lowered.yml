name: control_plane_transcript_retention_lowered
author: Raman Kumar
id: b1ef25b4-bf38-4439-9d36-949b6b68511b
title: Agent shortened its own transcript retention or turned history off
status: experimental
description: >
  A Write/Edit (or Codex apply_patch) of agent settings that sets Claude Code `cleanupPeriodDays` to 0-9 days (the
  default is 30; 0 stops transcripts being kept) or Codex `[history] persistence = "none"`. Short retention deletes the
  transcripts RetroHound audits before anyone scans them. The live hook lets a Write through that keeps or raises the
  value already in the file. Shell edits and deletions are files_transcript_tamper_command.
tags: [attack.defense_evasion, attack.t1070, attack.t1562, owasp_agentic.asi10]
falsepositives:
  - The user asked for shorter retention for privacy; the change should still come from the user, not the agent.
level: high
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: file_event }
detection:
  selection_claude:
    target_path|contains:
      - .claude/settings.json
      - .claude/settings.local.json
      - /.claude.json
    content|re|i: 'cleanupperioddays\\{0,2}[\x22\x27]?\s{0,3}:\s{0,3}[\x22\x27]?\d(?:[^\d]|$)'
  selection_codex:
    target_path|contains: .codex/config.toml
    content|re|i: 'persistence\s{0,3}=\s{0,3}[\x22\x27]none[\x22\x27]'
  # The live hook appends this to a Write that keeps or raises the file's current value (src/hooks/context.ts);
  # the same text in tool_input means the agent wrote it, so it does not count.
  filter_kept:
    content|contains: x-retrohound-retention-unchanged
  forged_kept:
    tool_input|contains: x-retrohound-retention-unchanged
  condition: (selection_claude and not (filter_kept and not forged_kept)) or selection_codex
