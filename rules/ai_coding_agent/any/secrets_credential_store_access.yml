title: Agent accessed a credential store, browser profile or AI-tool credential file
id: f1db7a83-7f84-4249-be31-2088d47b56e9
name: secrets_credential_store_access
author: Raman Kumar
status: experimental
description: >-
  A shell command or file read touches the OS credential store (macOS `security find-generic-password`, Windows
  `cmdkey /list`, `vaultcmd`, DPAPI unprotect), a browser profile (Login Data, Cookies), or an AI or cloud tool
  credential file (~/.claude/.credentials.json, ~/.codex/auth.json, ~/.gemini oauth, gh hosts.yml, ~/.docker/config.json,
  ~/.kube/config, ~/.vault-token). Existence-only probes (`cmdkey /list`, `security find-generic-password` without
  `-w` or `-g`) are left to secrets_credential_store_probe, which is low.
tags:
  - attack.credential_access
  - attack.t1555
  - attack.t1555.001
  - attack.t1552.001
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
detection:
  selection_cmd:
    category: process_creation
    command_line|contains:
      - security find-generic-password
      - security find-internet-password
      - security dump-keychain
      - cmdkey /l
      - vaultcmd
      - secret-tool lookup
      - protecteddata]::unprotect
      - login data
      - /.claude/.credentials.json
      - /.codex/auth.json
      - /.config/gh/hosts.yml
      - /.vault-token
  selection_path:
    category: file_access
    target_path|contains:
      - /.claude/.credentials.json
      - /.codex/auth.json
      - /.gemini/oauth_creds.json
      - /.config/gh/hosts.yml
      - /.docker/config.json
      - /.kube/config
      - /.vault-token
      - /google/chrome/user data/
      - /google/chrome/default/
      - /microsoft/edge/user data/
      - /.mozilla/firefox/
      - /.config/google-chrome/
      - /.config/chromium/
  # Existence-only probes list names but do not read a secret: reported by secrets_credential_store_probe instead.
  probe_security:
    command_line|contains: [security find-generic-password, security find-internet-password]
  extract_flags:
    command_line|contains: [' -w', ' -g']
  probe_cmdkey:
    command_line|contains: cmdkey /l
  condition: (selection_cmd and not probe_cmdkey and not (probe_security and not extract_flags)) or selection_path
falsepositives:
  - A user-requested check that a keychain entry exists
  - Debugging an app that keeps its own entry in the keychain
  - 'gh auth status does not match; cat ~/.config/gh/hosts.yml does'
level: high
x-retrohound:
  lane: enforce
