title: Agent read a secret file
id: 38a43e79-11a2-43a6-b8fb-d42d7b0b38cf
name: secrets_read_secret_file
author: Raman Kumar
status: experimental
description: >-
  The agent read a credential file (.env*, ~/.ssh/id_*, ~/.aws/credentials, .npmrc, .pypirc, .netrc, *.pem/*.p12/*.pfx)
  through a file tool (Read, or Grep naming the file). The whole file enters the model context and the transcript. Shell readers such as cat or
  grep are secrets_read_secret_file_shell (hunt: on real history they are mostly `K=$(grep KEY .env | cut ...)`, which
  uses the value without printing it). Blocked attempts are reported too.
tags:
  - attack.credential_access
  - attack.t1552.001
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
detection:
  selection_read:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  filter_nonsecret:
    target_path|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
  condition: selection_read and not filter_nonsecret
falsepositives:
  - Reading a .env to debug configuration the user asked about
  - Template files named .env.example, .env.sample and CA or public certificate .pem files (filtered)
level: medium
x-retrohound:
  lane: enforce
---
title: Agent read a secret file with a shell command
id: 5c0e7d92-1b3a-4f68-8a47-d92e6b15c3f0
name: secrets_read_secret_file_shell
author: Raman Kumar
status: experimental
description: >-
  A shell reader (cat, grep, sed, Get-Content and similar) names a credential file (.env*, ~/.ssh/id_*,
  ~/.aws/credentials, .npmrc, .pypirc, .netrc, *.pem/*.p12/*.pfx). Hunt only: on real developer history every hit was
  benign (pulling one key into a variable for an API call, redacting with sed), so denying it would block normal work.
  The Read-tool variant is secrets_read_secret_file. Sourcing a file (`source .env`) and copying it are not reads.
tags:
  - attack.credential_access
  - attack.t1552.001
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_cmd:
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}(?:[\s\x22\x27/=]|[\w.:~}%)]\\))?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  filter_nonsecret:
    command_line|re|i: '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
  condition: selection_cmd and not filter_nonsecret
falsepositives:
  - Reading a .env to debug configuration the user asked about
  - An `.env.example` named in the same command as a real .env hides that command from this rule
level: medium
x-retrohound:
  lane: hunt
