title: Agent disabled a safety control
id: 8abbabcf-57be-4441-a3e9-ab7ed71ef547
name: control_plane_disable_safety
author: Raman Kumar
status: experimental
description: >-
  A command or file write turns off a permission guard: `--dangerously-skip-permissions`,
  `--dangerously-bypass-approvals-and-sandbox`, `--yolo`, `skipDangerousModePermissionPrompt`,
  `defaultMode: bypassPermissions`, or a `permissions.allow` list holding a bare `*` or `Tool(*)` wildcard.
tags:
  - attack.defense_evasion
  - attack.t1562
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
detection:
  selection_flag:
    category: process_creation
    command_line|contains:
      - --dangerously-skip-permissions
      - --dangerously-bypass-approvals-and-sandbox
      - --yolo
  selection_write:
    - category: process_creation
      command_line|contains: &unsafe
        - skipdangerousmodepermissionprompt
        - bypasspermissions
        - '["\*"]'
        - '[\"\*\"]'
        - '(\*)"'
        - '(\*)\"'
    - category: file_event
      target_path|contains: &settings
        - .claude/settings
        - .gemini/settings.json
        - .codex/config
      content|contains: *unsafe
    - category: file_event
      target_path|contains: *settings
      tool_input|contains: *unsafe
  filter_discuss:
    command_line|re|i: '^\s{0,5}(?:echo|grep|rg|cat|man)\s'
  condition: (selection_flag or selection_write) and not filter_discuss
falsepositives:
  - Documentation or tests that mention the flag in an echo or grep (filtered when the command starts with echo, grep, rg, cat or man)
  - A wildcard in a deny or ask list (`["*"]`, `Bash(*)`) also matches; the rule cannot tell the list apart
  - A sandboxed throwaway container where bypass mode is deliberate
level: high
x-retrohound:
  lane: enforce
