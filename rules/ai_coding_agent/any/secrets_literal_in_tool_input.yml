title: Secret literal in a tool call, or secret read back from a secret file
id: 8066a976-5ea7-4522-9bb4-e35c83b20f09
name: secrets_literal_in_tool_input
author: Raman Kumar
status: experimental
description: >-
  A tool call carries a strong secret pattern (private key, AWS, GitHub, GitLab, Slack, Stripe, sk- key, JWT, Bearer
  token), or a read of a secret file returned one. The value is stored in plaintext under ~/.claude/projects. Rotate it.
  Pattern names come from the masker (ADR 0007); no value is stored.
tags:
  - attack.credential_access
  - attack.t1552
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
detection:
  selection_literal:
    secret_kinds|exists: true
  selection_result:
    result_secret_kinds|exists: true
  selection_secret_file:
    - category: file_access
      target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
    - category: process_creation
      command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}[\s\x22\x27/\\=])?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  # A sub-agent's hand-back report is prose about its work and often quotes header formats; a Task prompt that
  # carries a real key is exactly X1, so only the hand-back is filtered.
  filter_handback:
    tool_name: SubagentHandback
  condition: (selection_literal and not filter_handback) or (selection_result and selection_secret_file)
falsepositives:
  - Documentation-style placeholder tokens that happen to match a vendor pattern
  - A secret quoted in a sub-agent's hand-back report is not reported by this rule.
  - A test fixture key the user pasted on purpose
level: high
x-retrohound:
  lane: enforce
