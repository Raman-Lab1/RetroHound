name: files_invisible_unicode_skill
author: Raman Kumar
id: 7c0f3b52-6f0e-4a8e-9d7b-3a1c5e2d9b41
title: Invisible or bidirectional Unicode in a Skill body
status: experimental
description: >
  Tag-block characters (U+E0000 to U+E007F), bidi controls (U+202A-202E, U+2066-2069), zero-width space or word joiner
  in a Skill body the agent loaded. Same characters as files_invisible_unicode_instruction.
  U+200C, U+200D (emoji and Persian
  text) and U+FEFF (a BOM at the start) are left out on purpose. Hidden characters carry instructions a reviewer cannot see.
level: high
tags: [attack.defense_evasion, attack.t1027, owasp_agentic.asi01, owasp_agentic.asi06]
falsepositives:
  - Right-to-left documentation that uses bidi controls on purpose.
  - Zero-width space pasted from a web page into a rule file.
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: tool_call }
detection:
  skill:
    tool_name: Skill
  invisible:
    content|contains: [
      "\u200b", "\u2060", "\u202a", "\u202b", "\u202c", "\u202d", "\u202e", "\u2066",
      "\u2067", "\u2068", "\u2069", "\U000e0001", "\U000e0020", "\U000e0021", "\U000e0022", "\U000e0023",
