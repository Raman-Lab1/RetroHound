name: exec_nested_agent_cli
author: Raman Kumar
id: 5366702f-caa0-4d65-a1f0-715bb5d891cb
title: Agent started another agent CLI with its settings or home moved
status: experimental
description: >
  A shell command runs claude, codex, gemini or antigravity with its settings or home moved (--settings,
  --setting-sources, CLAUDE_CONFIG_DIR, CODEX_HOME). The child can then run without a user-scope RetroHound hook and
  its transcript can land outside the default scan roots. A hook entry in the agent's managed settings still covers
  such children. A plain headless run (-p, exec) is the hunt rule exec_nested_agent_cli_headless.
level: medium
tags: [attack.defense_evasion, attack.t1562, owasp_agentic.asi03, owasp_agentic.asi07]
falsepositives:
  - Scripts that run an agent CLI against a throwaway settings file or home on purpose.
  - Quoted text that shows such a command, for example a commit message or an echo, matches as if it ran.
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  moved_settings:
    command_line_unquoted|re|i: '(?:^|[\s;&|(`/])(?:claude(?:-code)?|codex|gemini|antigravity)(?:\.exe)?\s(?:[^;&|\n]{0,300}\s)?(?:--settings|--setting-sources)(?:[\s=]|$)'
  moved_home:
    command_line_unquoted|re|i: '\b(?:CLAUDE_CONFIG_DIR|CODEX_HOME)='
  condition: moved_settings or moved_home
