title: Shell command added hooks, a base-URL override or an MCP launcher to the agent control-plane config
id: c8a5e3f1-7d29-4b60-9e84-1f0b6d2a7c35
name: control_plane_agent_config_risky_shell_write
author: Raman Kumar
status: experimental
description: >-
  Same files as control_plane_agent_config_shell_write, but the command adds `hooks` or SessionStart (also Codex `[hooks]`), an
  `env.*_BASE_URL` or a TOML `base_url =`, `apiKeyHelper`, `enableAllProjectMcpServers` / `enabledMcpjsonServers`, or an MCP server command
  under a hidden directory (JSON or Codex `[mcp_servers]` TOML), or a command-running key (statusLine, awsAuthRefresh,
  awsCredentialExport, otelHeadersHelper, Codex `notify`) or disableAllHooks. Also any command that puts one of these
  files in place, moves or removes it (cp, ln, rsync, install, ditto into it; mv, rm, unlink, truncate, shred; dd of=;
  a checkout or restore of the config directory; find -delete; a python, node, perl, ruby, bun or deno one-liner that copies,
  writes or removes it), any overwrite of one (`>`, tee, sponge), and an in-place sed or perl edit of a hooks-bearing file
  that names the hook or its mode or deletes lines, since the hook cannot see the content of a file staged elsewhere. This is the persistence shape of supply-chain droppers and of CVE-2026-21852 style base-URL
  redirects. Write/Edit are control_plane_agent_config_risky_write.
tags:
  - attack.persistence
  - attack.t1546
  - attack.t1195.002
  - attack.t1528
  - owasp_agentic.asi04
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_bash:
    command_line|contains:
      - .claude?settings.json
      - .claude?settings.local.json
      - .mcp.json
      - .claude.json
      - .gemini?settings.json
      - .cursor?mcp.json
      - .continue?config.json
      - .windsurf?mcp.json
      - claude_desktop_config.json
      - .codex?config.toml
      - .codex?hooks.json
      - .gemini?config?mcp_config.json
      - .gemini?config?hooks.json
      - .agents?mcp_config.json
      - .agents?hooks.json
    command_line|re|i: '(?:^|[\s;&|(`])(?:sed\s(?:\S{1,12}\s){0,3}-[a-z]{0,6}i\b|tee\s|cp\s|mv\s|sponge\s|set-content\s|add-content\s|out-file\s)|[^>\d&]>{1,2}\s{0,3}[^\s;&|]{0,200}(?:settings(?:\.local)?\.json|mcp\.json|\.claude\.json|config\.json|config\.toml|hooks\.json)'
  selection_risky:
    - command_line|contains: &risky
        - '"hooks"'
        - '\"hooks\"'
        - sessionstart
        - _base_url"
        - '_base_url\"'
        - apikeyhelper
        - enableallprojectmcpservers
        - enabledmcpjsonservers
        - '[hooks'
        - '[[hooks'
        - 'base_url ='
        - 'base_url='
        - statusline
        - awsauthrefresh
        - awscredentialexport
        - otelheadershelper
        - disableallhooks
        - retrohound
    - tool_input|contains: *risky
    - command_line|re|i: &notify '(?:^|[^\w.])\\{0,3}[\x22\x27]?notify\\{0,3}[\x22\x27]?(?:\s|\\t){0,8}='
    - tool_input|re|i: *notify
    - command_line|re|i: '\\u00(?:2[0-57-9a-f]|3[0-9abdf]|[4-7][0-9a-f])'
    - command_line|re|i: '(?:mcp_servers)[^\[]{0,400}command\s{0,3}=\s{0,3}\[?\s{0,3}\\{0,2}"[^"]{0,200}/\.[a-z0-9_-]'
    - tool_input|re|i: '(?:mcp_servers)[^\[]{0,400}command\s{0,3}=\s{0,3}\[?\s{0,3}\\{0,2}"[^"]{0,200}/\.[a-z0-9_-]'
    - tool_input|re|i: '(?:mcpservers)[^}]{0,400}command\\{0,2}"\s{0,3}:\s{0,3}\\{0,2}"[^"]{0,200}/\.[a-z0-9_-]'
  # Placing, moving or removing a config file whose content the hook cannot see: the staged file was written somewhere
  # neutral first. Unquoted, so quoting does not split the path.
  selection_place:
    - command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:rm|unlink|shred|truncate|mv)\s[^;&|\n]{0,300}(?:(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json)|[\s/~](?:\.claude|\.codex|\.gemini|\.agents)[/\\]?(?:$|[\s;&|)]))'
    - command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:cp|ln|rsync|install|ditto)\s[^;&|\n]{0,300}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json)\s{0,3}(?:$|[;&|\n)<>]|\d>)'
    - command_line_unquoted|re|i: '\bof=[^\s;&|]{0,200}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json)'
    - command_line_unquoted|re|i: '\bgit\s(?:[^;&|\n]{0,300}\s)?(?:checkout|restore)\s[^;&|\n]{0,300}[\s/](?:\.claude|\.codex|\.gemini|\.agents|\.cursor|\.windsurf|\.continue|\.mcp\.json)(?:[/\s]|$)'
    - command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:python[0-9.]{0,5}|node|perl|ruby|bun|deno)\s(?:[^\n]{0,2000}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json)[^\n]{0,2000}(?:dump|write|copy|cp|move|rename|replace|remove|unlink|link|truncate|pop\(|del\s)|[^\n]{0,2000}(?:dump|write|copy|cp|move|rename|replace|remove|unlink|link|truncate|pop\(|del\s)[^\n]{0,2000}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json))'
    # Overwriting a config file drops whatever hook or server it held (`: >`, `echo {} >`, `cat staged >`, tee, sponge).
    - command_line_unquoted|re|i: '(?:(?:^|[^>\d&])>\|?\s{0,3}|(?:^|[\s;&|(`])(?:tee\s{1,3}(?:--?[b-z][\w-]*\s{1,3}){0,3}(?:[^\s;&|<>-][^\s;&|<>]{0,200}\s{1,3}){0,5}|sponge\s{1,3}|(?:set-content|out-file)\s[^;&|\n]{0,300}))[^\s;&|<>]{0,200}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.mcp\.json|\.claude\.json|\.gemini[/\\]?settings\.json|\.cursor[/\\]?mcp\.json|\.continue[/\\]?config\.json|\.windsurf[/\\]?mcp\.json|claude_desktop_config\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|(?:\.gemini[/\\]?config|\.agents)[/\\]?(?:mcp_config|hooks)\.json)'
    # A config-named file copied or linked into a config directory, or `-t DIR`.
    - command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:cp|ln|rsync|install|ditto)\s[^;&|\n]{0,300}(?:settings(?:\.local)?|hooks|mcp(?:_config)?|config)\.(?:json|toml)(?:\s[^;&|\n]{0,300}?)?[\s/~](?:\.claude|\.codex|\.gemini(?:[/\\]config)?|\.agents|\.cursor|\.windsurf|\.continue)[/\\]?\s{0,3}(?:$|[;&|\n)<>]|\d>)'
    - command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:cp|ln|install|mv)\s[^;&|\n]{0,300}(?:-t\s{0,3}|--target-directory[=\s])[^\s;&|]{0,200}(?:\.claude|\.codex|\.gemini(?:[/\\]config)?|\.agents|\.cursor|\.windsurf|\.continue)[/\\]?(?:\s|$)'
    - command_line_unquoted|re|i: '\bfind\s[^;&|\n]{0,300}(?:\.claude|\.codex|\.gemini|\.agents)\b[^;&|\n]{0,300}\s(?:-delete\b|-exec(?:dir)?\s{1,3}(?:rm|unlink|shred|truncate|mv|sed|perl|tee|cp)\b)'
  # An in-place sed or perl edit of a hooks-bearing file that names the hook, its mode, or deletes lines.
  selection_inplace:
    command_line_unquoted|re|i: '(?:^|[\s;&|(`])(?:sed|perl)(?:\s[^;&|\n]{0,300})?\s(?:-[a-z]{0,6}i|--in-place)[^&|\n]{0,600}(?:\.claude[/\\]?settings(?:\.local)?\.json|\.codex[/\\]?(?:config\.toml|hooks\.json)|\.gemini[/\\]?settings\.json|(?:\.gemini[/\\]?config|\.agents)[/\\]?hooks\.json)'
    command_line|re|i: '(?:\b(?:block|confirm|log|hooks?|run|retrohound|pretooluse|sessionstart|command|matcher)\b|--mode|(?:\d|\$|/)\s?d\b)'
  condition: (selection_bash and selection_risky) or selection_place or selection_inplace
falsepositives:
  - ruflo and similar tools register hook-handler commands under .claude/helpers on purpose
  - Corporate gateways set ANTHROPIC_BASE_URL in settings (see control_plane_llm_endpoint_command for the allowlist idea)
level: high
x-retrohound:
  lane: enforce
