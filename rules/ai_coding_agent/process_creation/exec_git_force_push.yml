name: exec_git_force_push
author: Raman Kumar
id: d2efb207-5126-463b-90f5-f26cadb6f68c
title: Git force push or history rewrite
status: experimental
description: >
  git push with -f (alone or in a cluster such as -fu), --force, --mirror, a +refspec (`+HEAD:main`) or a deleting
  `:ref`, or git filter-branch / filter-repo. Quotes do not hide it. --force-with-lease is the safe form and is not
  matched. The rule cannot tell the default branch from a feature branch, so it fires on both.
level: medium
tags: [attack.impact, attack.t1565, owasp_agentic.asi02]
falsepositives:
  - Force-pushing a rebased feature branch the user asked for.
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  force_push:
    command_line_unquoted|re|i: '\bgit\b[^;&|]{0,60}\spush\b[^;&|]{0,200}\s(-[a-z46]{0,6}f[a-z46]{0,6}|--force|--mirror|\+[\w/.:-]{1,120}|:[\w/.-]{1,120})(\s|$|[;&|])'
  rewrite_tools:
    command_line_unquoted|re|i: '\bgit\b[^;&|]{0,60}\sfilter-(branch|repo)\b'
  condition: force_push or rewrite_tools
