title: Agent checked whether a credential store entry exists
id: dd85774f-e15d-4a13-a42a-7ab96bc53029
name: secrets_credential_store_probe
author: Raman Kumar
status: experimental
description: >-
  `cmdkey /list`, or macOS `security find-generic-password` / `find-internet-password` without `-w` or `-g`. These show
  that an entry exists (names, attributes) but do not print the secret. The extraction forms are
  secrets_credential_store_access, which is high.
tags:
  - attack.credential_access
  - attack.t1555
  - attack.t1555.001
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  probe_security:
    command_line|contains: [security find-generic-password, security find-internet-password]
  extract_flags:
    command_line|contains: [' -w', ' -g']
  probe_cmdkey:
    command_line|contains: cmdkey /l
  condition: probe_cmdkey or (probe_security and not extract_flags)
falsepositives:
  - A user-requested check that a keychain entry exists, or a login script that tests for its own entry.
level: low
x-retrohound:
  lane: hunt
