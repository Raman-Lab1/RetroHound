name: files_transcript_tamper_command
author: Raman Kumar
id: 1f577120-5ca0-4cea-bd65-cdf06df3081f
title: Shell command deletes agent transcripts or the RetroHound index
status: experimental
description: >
  rm, rmdir, unlink, shred, truncate, mv (as the source), Remove-Item, del, rd, a `>` overwrite or `find -delete` aimed at agent
  transcripts or history: ~/.claude/projects, ~/.claude/history.jsonl, ~/.codex/sessions, ~/.codex/archived_sessions,
  ~/.codex/history.jsonl, ~/.gemini/antigravity and ~/.gemini/antigravity-cli (brain, history) or the whole ~/.claude,
  ~/.codex or ~/.gemini directory; also ~/.retrohound and `retrohound purge --yes`. Also a command that sets Claude Code
  `cleanupPeriodDays` to 0-9 days or Codex history persistence to none. Each of these destroys the record of what the
  agent did. Write/Edit of the settings is control_plane_transcript_retention_lowered. Also an interpreter one-liner (python -c shutil.rmtree/os.remove, node -e fs.rmSync/unlinkSync, ruby, perl, php) that
  deletes one of those paths. A lone git commit or git tag with no shell metacharacters (; & | ` $ > ( or newline) is not matched, whatever its message says. Known gap: a heredoc script or a path assembled in pieces is not matched.
tags: [attack.defense_evasion, attack.t1070, attack.t1070.004, owasp_agentic.asi10]
falsepositives:
  - The user asked the agent to free disk space or wipe old sessions; better done by the user outside the agent.
level: high
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  # Both spellings: command_line keeps Windows backslashes, command_line_unquoted undoes `.cl"au"de` quoting.
  selection_delete:
    - command_line|re|i: &delete '(?:^|[\s;&|(`])(?:rm|rmdir|unlink|shred|srm|truncate|remove-item|ri|del|erase|rd)\s[^;&|\n]{0,300}(?:\.claude[/\\](?:projects|history\.jsonl)|\.codex[/\\](?:archived_)?(?:sessions|history\.jsonl)|\.gemini[/\\]antigravity|\.retrohound(?:$|[/\\\s*;&|)])|(?:~|home\}?|userprofile%?|/(?:home|users)/[^/\s;&|]{1,64}|/root)[/\\]\.(?:claude|codex|gemini)[/\\]?\*?(?:$|[\s;&|)]))'
    - command_line_unquoted|re|i: *delete
  # mv only with the transcript as a source (another argument follows it): moving a copy back into place is a restore.
  selection_move:
    - command_line|re|i: &move '(?:^|[\s;&|(`])mv\s[^;&|\n]{0,300}(?:(?:\.claude[/\\](?:projects|history\.jsonl)|\.codex[/\\](?:archived_)?(?:sessions|history\.jsonl)|\.gemini[/\\]antigravity)[^\s;&|]{0,300}|\.retrohound(?:[/\\*][^\s;&|]{0,300})?|(?:~|home\}?|userprofile%?|/(?:home|users)/[^/\s;&|]{1,64}|/root)[/\\]\.(?:claude|codex|gemini)[/\\]?\*?)\s{1,5}[^\s;&|]'
    - command_line_unquoted|re|i: *move
  selection_overwrite:
    - command_line|re|i: &overwrite '(?:^|[^>\d&])>\|?\s{0,3}[^\s;&|<>]{0,200}(?:\.claude[/\\](?:projects|history\.jsonl)|\.codex[/\\](?:archived_)?(?:sessions|history\.jsonl)|\.gemini[/\\]antigravity)'
    - command_line_unquoted|re|i: *overwrite
  selection_find:
    command_line_unquoted|re|i: '\bfind\s[^;&|\n]{0,300}(?:\.claude[/\\]projects|\.codex[/\\](?:archived_)?sessions|\.gemini[/\\]antigravity|\.retrohound)[^;&|\n]{0,300}\s(?:-delete\b|-exec(?:dir)?\s{1,3}(?:rm|unlink|shred|truncate)\b)'
  # A python, node, bun, ruby, perl or php one-liner (-c / -e / -r) that deletes a path naming a transcript store.
  # The interpreter must sit at command position (start, or after ; & | ( sh -c or sudo/env), so a commit message or echo that quotes
  # a one-liner does not match; a path must end at a boundary, so .retrohound-test-dir and projects-old do not.
  # ponytail: a one-liner that deletes something unrelated and only reads a transcript on the same line still matches; a
  # path built in pieces (Path.home()/'.claude'/'projects') and heredoc scripts are not matched; a shell-out is matched
  # for os.system, subprocess.*, child_process and exec( followed by rm/rmdir/unlink/shred.
  selection_interp:
    - command_line|re|i: &interp '(?:^|[;&|(`]|\b(?:ba|z)?sh\s{1,5}-\w{0,5}c)\s{0,5}[''"]?\s{0,5}(?:(?:sudo|env|time|nohup|\w{1,30}=\S{0,100})\s{1,5}){0,4}(?:/[^\s;&|]{1,100}/)?(?:python[\d.]{0,5}|node(?:js)?|bun|ruby|perl|php)\s{1,5}(?:-[\w-]{1,20}\s{1,5}){0,3}-[ceEr]\s[^\n]{0,300}(?:(?:(?:shutil\.rmtree|os\.(?:remove|unlink|rmdir|removedirs)|\.unlink\(|\.rmdir\(|rmtree|remove_tree|(?:rm|rmdir|unlink)Sync|fs(?:\.promises)?\.(?:rm|rmdir|unlink)\(|FileUtils\.rm\w{0,6}|File\.delete|Dir\.rmdir|\bunlink\b|\brmdir\b)|(?:os\.system|subprocess\.\w{1,12}|child_process\S{0,30}|exec(?:Sync)?\()[^\n]{0,300}\b(?:rm|rmdir|unlink|shred)\s)[^\n]{0,300}(?:\.claude[/\\](?:projects|history\.jsonl)|\.codex[/\\](?:archived_)?(?:sessions|history\.jsonl)|\.gemini[/\\]antigravity(?:-cli)?|\.retrohound)(?:$|[/\\\s''"*;&|)])|(?:\.claude[/\\](?:projects|history\.jsonl)|\.codex[/\\](?:archived_)?(?:sessions|history\.jsonl)|\.gemini[/\\]antigravity(?:-cli)?|\.retrohound)(?:$|[/\\\s''"*;&|)])[^\n]{0,300}(?:shutil\.rmtree|os\.(?:remove|unlink|rmdir|removedirs)|\.unlink\(|\.rmdir\(|rmtree|remove_tree|(?:rm|rmdir|unlink)Sync|fs(?:\.promises)?\.(?:rm|rmdir|unlink)\(|FileUtils\.rm\w{0,6}|File\.delete|Dir\.rmdir|\bunlink\b|\brmdir\b))'
    - command_line_unquoted|re|i: *interp
  selection_purge:
    command_line|re|i: '\bretrohound\s{1,3}purge\b[^;&|\n]{0,200}\s--yes\b'
  selection_retention:
    - command_line_unquoted|re|i: 'cleanupperioddays\s{0,3}[:=\s]\s{0,3}\d(?:[^\d]|$)'
    - command_line_unquoted|re|i: 'history\.persistence\s{0,3}=\s{0,3}none|persistence\s{0,3}=\s{0,3}none[^;&|\n]{0,300}\.codex[/\\]config\.toml'
  # Claude Code auto-memory lives under ~/.claude/projects/<dir>/memory/ and agents edit it on purpose.
  # ponytail: a line that touches memory and also deletes a transcript is filtered whole; split per path if abused.
  filter_memory:
    command_line_unquoted|re|i: '\.claude[/\\]projects[/\\][^/\\\s;&|]{1,300}[/\\]memory(?:[/\\]|\s|$)'
  # A lone read-only search names `rm -rf` or `mv ` as its pattern; any ; & | ` $ > or ( in the line keeps the rule on (`<(...)` runs first).
  filter_search:
    command_line|re|i: '^\s{0,5}(?:[efz]?grep|rg|ag|ack|git\s{1,5}grep)\s[^;&|`$>(\n]{0,2000}$'
  search_pre: # rg --pre runs a command on every file it searches
    command_line|re|i: '\s--pre\b'
  # A lone git commit/tag with none of ; & | ` $ > ( or newline, so <(..), =(..) and PowerShell (..) still match; `-C dir`
  # is allowed, `-c k=v` is not (core.fsmonitor, gpg.program and core.editor run commands); case-sensitive for -C vs -c.
  filter_git_message:
    command_line|re: '^\s{0,5}git(?:[ \t]{1,5}-C[ \t]{1,5}(?:"[^"\n;&|`$>(]{1,300}"|''[^''\n;&|`$>(]{1,300}''|[^\s;&|`$>(''"]{1,300})){0,3}[ \t]{1,5}(?:commit|tag)[ \t][^;&|`$>(\n]{0,2000}$'
  condition: 1 of selection_* and not filter_memory and not (filter_search and not search_pre) and not filter_git_message
