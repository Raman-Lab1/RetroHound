name: exec_decode_to_shell
author: Raman Kumar
id: 96b1ae8c-3e8b-433f-af7a-9175f45ebffe
title: Base64 or hex decoded payload executed
status: experimental
description: >
  Output of base64/xxd decoding is piped to a shell or eval'd, or PowerShell runs an encoded command or decodes
  Base64 into iex. Hides what runs from anyone reading the transcript.
level: high
tags: [attack.defense_evasion, attack.t1140, attack.execution, attack.t1059, owasp_agentic.asi05]
falsepositives:
  - Tooling that legitimately ships an -EncodedCommand argument (some CI or management scripts).
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  posix_pipe:
    command_line|re|i: '\b(base64|xxd)\b[^;&]{0,500}\|\s{0,5}(sudo\s{1,5})?(ba|z|da)?sh\b'
  posix_subst:
    command_line|contains: ['sh <(*base64']
  posix_eval:
    command_line|re|i: '\b(?:eval|sh\s{1,3}-c)\s{1,5}[\x22\x27]?[$\x60]\(?[^)]{0,300}(?:base64\s{1,3}(?:-d|--decode)|xxd\s{1,3}-r)'
  ps_encoded:
    command_line|contains:
      - 'powershell*-encodedcommand'
      - 'powershell*-enc '
      - 'pwsh*-encodedcommand'
      - 'pwsh*-enc '
      - 'iex*frombase64string'
      - 'invoke-expression*frombase64string'
      - 'frombase64string*| iex'
  ps_encoded_flag:
    # -e/-ec/-enc: only flags (each with at most one bare-word value) between the executable and it, so a later
    # grep -e, sed -e or robocopy /E is not it.
    command_line|re|i: '\b(?:powershell|pwsh)(?:\.exe)?[\x22\x27]?(?:\s{1,5}[-/\u2013\u2014\u2015]\w{1,30}(?:\s{1,5}\w{1,30})?){0,8}\s{1,5}[-/\u2013\u2014\u2015](?:e|ec|enc|encodedcommand)\s{1,5}[\x22\x27]?[a-z0-9+/]{4}'
  condition: 1 of posix_* or 1 of ps_*
