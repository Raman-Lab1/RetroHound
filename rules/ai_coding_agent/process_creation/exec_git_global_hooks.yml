name: exec_git_global_hooks
author: Raman Kumar
id: 3985942b-11ee-4bad-82ec-879cf4be7ae1
title: Global git hook redirection
status: experimental
description: >
  git config --global (or --system) sets init.templateDir or core.hooksPath, so hooks run in every repository on the
  machine. Project-local core.hooksPath and other repository-local code-running keys are exec_git_repo_code_exec.
  Writes into ~/.git-templates/hooks are not covered by this rule.
level: high
tags: [attack.persistence, attack.t1546, owasp_agentic.asi05]
falsepositives:
  - A user who sets up a global hooks directory for a whole team on purpose.
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  # `git [-C dir …] config … --global|--system`, any spacing; quotes do not hide the key (`core.hooks''Path`).
  scope:
    command_line_unquoted|re|i: '\bgit\b[^;&|\n]{0,200}\sconfig\b[^;&|\n]{0,300}\s--(?:global|system)\b'
  key:
    command_line_unquoted|contains: ['init.templatedir', 'core.hookspath']
  condition: scope and key
