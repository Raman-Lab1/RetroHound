name: exec_docker_privileged
author: Raman Kumar
id: a1a1b68c-6979-4d17-a58a-447912fe5dc0
title: Container started with host-level access
status: experimental
description: >
  docker, podman or nerdctl run, container run or create (after global options such as -H) with --privileged, the
  host root mounted (-v /:, --mount src=/), the Docker socket mounted, the host PID namespace, or CAP_SYS_ADMIN or ALL.
  Each gives the container a way to escape to the host.
level: high
tags: [attack.privilege_escalation, attack.t1611, owasp_agentic.asi05]
falsepositives:
  - CI helpers and tools that mount docker.sock on purpose (testcontainers, portainer, buildx).
x-retrohound: { lane: enforce }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  # [global options such as -H HOST] [container] run|create … one of the host-access options, in one command.
  selection:
    command_line_unquoted|re|i: '\b(?:docker|podman|nerdctl)(?:\s{1,5}[^\s;&|]{1,200}){0,4}?\s{1,5}(?:container\s{1,5})?(?:run|create)\s[^;&|\n]{0,2000}?(?:--privileged|(?:-v|--volume)[\s=]{0,5}/:|--mount[\s=]{1,5}[^\s]{0,200}?\b(?:src|source)=/(?:,|\s|$)|docker\.sock|--pid[\s=]{1,5}host|--cap-add[\s=]{1,5}(?:cap_)?(?:sys_admin|all)\b)'
  condition: selection
