name: secrets_cloud_metadata
author: Raman Kumar
id: 86c9f486-55b2-47fb-b7b9-cba330ba2a64
title: Shell command reaches the cloud instance metadata service
status: experimental
description: >
  A command names the instance metadata service: 169.254.169.254 (AWS, Azure, GCP, also as 2852039166 or 0xa9fea9fe),
  AWS IPv6 fd00:ec2::254, metadata.google.internal, or the ECS task-credential endpoint 169.254.170.2. On a cloud host
  this hands out the instance role's temporary credentials. A plain grep or rg over source code that only mentions the
  address is not matched. Web requests are secrets_cloud_metadata_web.
level: medium
tags: [attack.credential_access, attack.t1552.005, owasp_agentic.asi03]
falsepositives:
  - Agent working on a cloud VM or container that reads the instance id or region on purpose.
  - A test or script that mocks the metadata endpoint and names the address in its command.
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  selection:
    command_line|re|i: '(?:169\.254\.169\.254|169\.254\.170\.2|2852039166|0xa9fea9fe)(?:[^\d]|$)|fd00:ec2::254|metadata\.google\.internal'
  # A lone search command over code, no other command in the line.
  filter_search:
    command_line|re|i: '^\s{0,5}(?:grep|egrep|fgrep|rg|ag|ack|git\s{1,5}grep)\s[^;&|\n`$]{0,2000}$'
  condition: selection and not filter_search
