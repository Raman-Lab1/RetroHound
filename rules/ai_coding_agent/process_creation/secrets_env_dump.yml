title: Environment variables dumped to the agent
id: 78fff43a-cdfd-4f68-81ed-fe3c568d65b2
name: secrets_env_dump
author: Raman Kumar
status: experimental
description: >-
  A bare dump of the whole environment (`env`, `printenv`, `export`, `export -p`, `declare -x`, `set`,
  `Get-ChildItem env:`, `[Environment]::GetEnvironmentVariables()`), `env | grep` for credential-looking names, or code
  that prints `os.environ` / `process.env` whole. The output carries every token in the environment into the model
  context. Shell forms count only in command position: line start, after `;` `&` a newline or `$(`, or a subshell `(`
  that is itself in command position; `env` and `printenv` also after `|` when that ends the command (not
  `a|env|b` in a grep pattern). Builtins are matched case-sensitively, so
  `defaultdict(set)`, `serve(env)`, a Markdown `| Env |` cell, `(import|export)` in a grep pattern and `` `set` `` in
  prose are not matched. `env` and `printenv` outside a pipe match in any case, because macOS and Windows file systems
  find `ENV` as `env`. `env | grep PATH` style lookups and `env VAR=x cmd` are not matched.
tags:
  - attack.discovery
  - attack.credential_access
  - attack.t1082
  - attack.t1552
  - owasp_agentic.asi03
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_dump:
    command_line|re: '(?:^|[;&\n]|\$\()\s{0,5}(?:\(\s{0,5})?(?:(?:/[\w./-]{0,60}/)?(?:env|printenv)|set|export(?:\s+-p)?|declare\s+-[px])\s{0,5}(?:$|[;&|>)\n]|[12]>)|\|\s{0,5}(?:/[\w./-]{0,60}/)?(?:env|printenv)\s{0,5}(?:$|[;&>\n]|[12]>)'
  selection_dump_anycase:
    command_line|re|i: '(?:^|[;&\n]|\$\()\s{0,5}(?:\(\s{0,5})?(?:/[\w./-]{0,60}/)?(?:env|printenv)\s{0,5}(?:$|[;&|>)\n]|[12]>)'
  # cmd.exe `SET`: upper case alone, or any case behind `cmd /c`.
  selection_dump_cmd:
    - command_line|re: '(?:^|[;&\n]|\$\()\s{0,5}SET\s{0,5}(?:$|[|\n])'
    - command_line|re|i: '(?:^|[\s;&|(`])cmd(?:\.exe)?\s{1,5}/[ck]\s{1,5}[\x22\x27]?set\s{0,5}(?:$|[|\n&>\x22\x27])'
  selection_code:
    command_line|re: '(?:print|pprint|json\.dumps?|console\.(?:log|dir)|JSON\.stringify)\(\s{0,5}(?:dict\(\s{0,5})?(?:os\.environ|process\.env)(?:\.items\(\))?\s{0,5}[,)]'
  selection_ps:
    command_line|re|i: '(?:^|[\s;&|(`])(?:get-childitem|gci|ls|dir|get-item)\s+(?:-path\s+)?env:\s{0,5}(?:$|[;&|)*])|\[environment\]::getenvironmentvariables\('
  selection_cred_grep:
    command_line|re|i: '(?:^|[\s;&|(`])(?:env|printenv)\s{0,5}\|\s{0,5}(?:grep|rg|egrep)\s[^;&|\n]{0,80}(?:key|token|secret|passw|credential|anthropic|openai|aws_)'
  filter_grep:
    command_line|re|i: '(?:^|[\s;&|(`])(?:env|printenv)\s{0,5}\|\s{0,5}(?:grep|rg|egrep|fgrep)\s'
  condition: (1 of selection_dump* and not filter_grep) or selection_ps or selection_cred_grep or selection_code
falsepositives:
  - Debugging PATH or a toolchain problem with a full env dump
  - '`set` is also a shell option builtin; only the bare form is matched'
level: medium
x-retrohound:
  lane: enforce
