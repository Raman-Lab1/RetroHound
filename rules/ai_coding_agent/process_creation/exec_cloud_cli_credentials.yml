name: exec_cloud_cli_credentials
author: Raman Kumar
id: 1fec3200-b54c-4e1f-9a10-683909865fc5
title: Cloud CLI used to print or mint credentials
status: experimental
description: >
  aws sts get-caller-identity, aws configure export-credentials, gcloud auth print-access-token, az account
  get-access-token, gh auth token and PowerShell equivalents. Prints a live token or proves which identity the agent holds.
level: medium
tags: [attack.credential_access, attack.t1528, owasp_agentic.asi03]
falsepositives:
  - Cloud and DevOps work where the user asked the agent to authenticate or deploy.
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  selection:
    command_line|contains:
      - 'aws sts get-caller-identity'
      - 'aws sts assume-role'
      - 'aws configure export-credentials'
      - 'aws configure get aws_secret_access_key'
      - 'aws sso get-role-credentials'
      - 'gcloud auth print-access-token'
      - 'gcloud auth print-identity-token'
      - 'gcloud auth application-default print-access-token'
      - 'az account get-access-token'
      - 'gh auth token'
      - 'get-azaccesstoken'
      - 'get-stscalleridentity'
  condition: selection
