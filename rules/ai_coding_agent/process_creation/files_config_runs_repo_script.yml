name: files_config_runs_repo_script
author: Raman Kumar
id: be41a1f6-22ea-46f3-99f8-bf3cb2a84c5f
title: Repo config runs a repo script without being asked
status: experimental
description: >
  `preflight` only. A file in the repo makes a command run on its own, and the command runs a script that ships in the
  repo (`./x.sh`, `$CLAUDE_PROJECT_DIR/x`, `node scripts/x.js`): a hook in .claude/settings.json, .gemini/settings.json or
  .codex/hooks.json (tool_name `open:hook:<Event>`), a devcontainer lifecycle command such as postCreateCommand
  (`open:devcontainer:<key>`), a husky hook (`open:husky`), a line of .envrc (`open:envrc`) or a VS Code task set to
  run on folder open (`open:task`). The script is whatever the repo's author put there, run with your rights when you open the
  folder, create the container, commit or `cd` in (the "config runs a repo script on open" supply-chain pattern). Commands
  that call only tools on PATH, and `./node_modules/.bin/` binaries, are not matched. Manual VS Code tasks are not read, and `dependsOn` tasks are not followed. A hook that runs an interpreter on a `.claude/` path is
  also reported by control_plane_hook_repo_script; the two findings may overlap.
level: medium
tags: [attack.execution, attack.persistence, attack.t1059, attack.t1195.002, owasp_agentic.asi05, owasp_agentic.asi04]
falsepositives:
  - A team's own bootstrap script (`./scripts/setup.sh` in postCreateCommand, a husky hook calling `./scripts/lint.sh`).
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  selection_source:
    tool_name|startswith: 'open:'
  selection_script:
    # command position only: line start, after ; & | ( , or as the argument of source, `.`, exec or a shell. `PATH_add ./bin`, `dotenv ./.env`, `cd ../x` are data.
    - command_line|re|i: '(?:^|[;&|(]\s*|\b(?:source|source_env|exec|bash|sh|zsh)\s+|\s\.\s+)[\x22\x27]?(?:\.{1,2}/|\$\{?(?:claude_project_dir|containerworkspacefolder|workspacefolder|localworkspacefolder|pwd)\}?/)[\w@.-]'
    - command_line|re|i: '\b(?:node|bun|deno|python3?|ruby|perl|pwsh|sh|bash|zsh)\s+(?:-[\w-]+\s+)?[\w@-][\w@./-]*\.(?:sh|bash|js|mjs|cjs|ts|py|rb|pl|ps1)\b'
  filter_node_modules_bin:
    command_line|re|i: '^(?:[^\s]+\s+)?\./node_modules/\.bin/'
  condition: selection_source and selection_script and not filter_node_modules_bin
