name: network_paste_filedrop_command
author: Raman Kumar
id: b3f6d8a2-91c4-4e07-a5d3-2e8c7f1b4a60
title: Shell command that reaches a paste, file-drop, tunnel or webhook service
status: experimental
description: >
  A shell command that reaches a paste site, anonymous file host, tunnel (ngrok, trycloudflare),
  request catcher (webhook.site, interact.sh) or a Discord/Slack webhook. These are common exfiltration endpoints.
level: medium
tags: [attack.exfiltration, attack.t1567, attack.t1041, owasp_agentic.asi01]
falsepositives:
  - Sharing a log on pastebin or testing a webhook with webhook.site because the user asked for it.
  - ngrok or a tunnel used to demo a local dev server.
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: process_creation }
detection:
  in_command:
    command_line|contains:
      - '//pastebin.com'
      - '.pastebin.com'
      - ' pastebin.com'
      - '//paste.ee'
      - '.paste.ee'
      - ' paste.ee'
      - '//hastebin.com'
      - '.hastebin.com'
      - ' hastebin.com'
      - '//ghostbin.com'
      - '.ghostbin.com'
      - ' ghostbin.com'
      - '//rentry.co'
      - '.rentry.co'
      - ' rentry.co'
      - '//dpaste.org'
      - '.dpaste.org'
      - ' dpaste.org'
      - '//ix.io'
      - '.ix.io'
      - ' ix.io'
      - '//termbin.com'
      - '.termbin.com'
      - ' termbin.com'
      - '//transfer.sh'
      - '.transfer.sh'
      - ' transfer.sh'
      - '//file.io'
      - '.file.io'
      - ' file.io'
      - '//0x0.st'
      - '.0x0.st'
      - ' 0x0.st'
      - '//temp.sh'
      - '.temp.sh'
      - ' temp.sh'
      - '//bashupload.com'
      - '.bashupload.com'
      - ' bashupload.com'
      - '//anonfiles.com'
      - '.anonfiles.com'
      - ' anonfiles.com'
      - '//gofile.io'
      - '.gofile.io'
      - ' gofile.io'
      - '//ngrok.io'
      - '.ngrok.io'
      - ' ngrok.io'
      - '//ngrok-free.app'
      - '.ngrok-free.app'
      - ' ngrok-free.app'
      - '//ngrok.app'
      - '.ngrok.app'
      - ' ngrok.app'
      - '//trycloudflare.com'
      - '.trycloudflare.com'
      - ' trycloudflare.com'
      - '//webhook.site'
      - '.webhook.site'
      - ' webhook.site'
      - '//requestbin.com'
      - '.requestbin.com'
      - ' requestbin.com'
      - '//pipedream.net'
      - '.pipedream.net'
      - ' pipedream.net'
      - '//interact.sh'
      - '.interact.sh'
      - ' interact.sh'
      - '//oast.fun'
      - '.oast.fun'
      - ' oast.fun'
      - '//oast.live'
      - '.oast.live'
      - ' oast.live'
      - '//oast.pro'
      - '.oast.pro'
      - ' oast.pro'
      - '//oast.site'
      - '.oast.site'
      - ' oast.site'
      - '//oast.me'
      - '.oast.me'
      - ' oast.me'
      - '//burpcollaborator.net'
      - '.burpcollaborator.net'
      - ' burpcollaborator.net'
      - 'discord.com/api/webhooks/'
      - 'discordapp.com/api/webhooks/'
      - 'hooks.slack.com/services/'
  condition: in_command
