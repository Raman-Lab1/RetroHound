title: Secret file read followed by an MCP call carrying a large string argument
id: b47d19e3-6a0c-4c85-9f2e-3d58a1c07e64
name: secrets_read_then_mcp_payload
author: Raman Kumar
status: experimental
description: >-
  Within one session, a secret-file read is followed within an hour by an MCP tool call whose input holds a single
  string longer than 1 KB. This is the shape of MCP tool poisoning and SANDWORM_MODE style exfiltration, where a
  hidden tool description makes the agent pass `~/.ssh/id_*` or `.env` text in a `context` argument. A strong secret
  pattern anywhere in an MCP input is already reported by secrets_literal_in_tool_input. MCP calls that carry a URL
  count as web requests and are left to secrets_read_then_egress. Sub-agent events join the parent session.
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552.001
  - attack.t1041
  - owasp_agentic.asi01
  - owasp_agentic.asi02
  - owasp_agentic.asi04
correlation:
  type: temporal_ordered
  rules:
    - secrets_read_for_egress
    - mcp_large_string_argument
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - MCP tools that legitimately take file contents (code review, document or browser fill tools)
  - Reading a .env for an unrelated task and passing a long prompt to a local MCP server; allowlist the server
level: medium
x-retrohound:
  lane: hunt
---
title: Helper, MCP call with a string argument over 1 KB
id: 2e9c5a71-d803-4b1f-a6e4-71c0b9f35d28
name: mcp_large_string_argument
author: Raman Kumar
description: Silenced step two of secrets_read_then_mcp_payload. Only the first 8 KiB of the input is inspected.
logsource:
  product: ai_coding_agent
detection:
  selection_mcp:
    category: mcp
    tool_input|re: '"(?:[^"\\]|\\.){1024,}"'
  filter_blocked:
    outcome: blocked
  condition: selection_mcp and not filter_blocked
level: informational
