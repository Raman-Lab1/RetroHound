title: Untrusted content read, then a secret read and network egress
id: 33dd6ff2-4428-4459-97fa-a087393802b2
name: injection_untrusted_then_secret_egress
author: Raman Kumar
status: experimental
description: >-
  Within one session and ten minutes of taking in content it did not write (untrusted_content_received: a web page or
  search, an MCP tool result, gh issue/PR/repo text), the agent read a secret file and then made a network egress call
  (the two steps of secrets_read_then_egress, in that order). The shape of an injected "send me your .env".
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi01
  - owasp_agentic.asi03
correlation:
  type: temporal_ordered
  rules:
    - untrusted_content_received
    - secrets_read_for_egress
    - secrets_egress_call
  group-by:
    - session_id
  timespan: 10m
falsepositives:
  - Reading an API's docs, then calling that API with a key from .env
level: medium
x-retrohound:
  lane: hunt
