title: Identity recon, then a secret harvest, then network egress
id: d42ad6fe-adb6-4543-956a-fc4ed2b3f10c
name: secrets_recon_read_egress
author: Raman Kumar
status: experimental
description: >-
  Within one session and one hour, in this order: the agent asks who and where it is (whoami, id, hostname, uname,
  groups, a bare env or printenv, aws sts get-caller-identity, gcloud auth list, az account show, gh auth status,
  kubectl auth whoami), then harvests a secret (secrets_harvest_for_recon: a secret file read, an environment dump or a cloud CLI call that
  prints a token), then sends data out
  (secrets_egress_call). This is the operator pattern of a hijacked agent: orient, harvest, exfiltrate. It is the same
  read and egress as secrets_read_then_egress with recon in front, so the two fire together for a file read; this one is
  the narrower lead and also covers the env dump and cloud token paths.
tags:
  - attack.discovery
  - attack.credential_access
  - attack.exfiltration
  - attack.t1033
  - attack.t1082
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi03
  - owasp_agentic.asi10
correlation:
  type: temporal_ordered
  rules:
    - secrets_recon_command
    - secrets_harvest_for_recon
    - secrets_egress_call
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Debugging a deploy, where the agent checks the active identity, reads a key from .env and calls the API it belongs to
  - A bare `env` is both the recon and the harvest, so it followed by any network call fires
level: high
x-retrohound:
  lane: hunt
---
title: Helper, identity and host recon command
id: 449eb2c6-a88d-42da-bb08-fbfdec753469
name: secrets_recon_command
author: Raman Kumar
description: >-
  Silenced step one of secrets_recon_read_egress. Shell builtins count only in command position and with at most one
  short flag, so `id` in prose or `env FOO=1 cmd` is not matched; case-sensitive.
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_host:
    command_line|re: '(?:^|[;&|\n(`]|\$\()\s{0,5}(?:whoami|id|hostname|uname|groups|env|printenv)(?:\s{1,5}[-/][a-zA-Z]{1,6})?\s{0,5}(?:$|[;&|>)\n`])'
  selection_cloud:
    command_line|contains:
      - 'sts get-caller-identity'
      - 'gcloud auth list'
      - 'az account show'
      - 'gh auth status'
      - 'kubectl auth whoami'
      - 'get-stscalleridentity'
  condition: 1 of selection_*
level: informational
---
title: Helper, secret harvest (file read, environment dump or cloud token)
id: 5b7c1d3e-8a24-4f60-9c1b-2d6e4a8f0b13
name: secrets_harvest_for_recon
author: Raman Kumar
description: >-
  Silenced step two of secrets_recon_read_egress: a secret read that was not blocked (secrets_read_for_egress), an
  environment dump (secrets_env_dump) or a cloud CLI call that prints or mints a credential
  (exec_cloud_cli_credentials, minus the identity-only get-caller-identity forms, which are recon). A correlation step cannot be an either-or of rules, so the three predicates are copied
  here; the drift test in tests/rules.test.ts fails when one stops matching its source rule's positive file. A blocked
  call does not count.
logsource:
  product: ai_coding_agent
detection:
  read_file:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  read_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}(?:[\s\x22\x27/=]|[\w.:~}%)]\\))?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  read_filter_nonsecret:
    - command_line|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
    - target_path|re|i: *nonsecret
  # A real secret named next to a sample (`cat .env .env.example`) keeps the read: the filter is per command line.
  read_cmd_secret:
    command_line|re|i: '(?:^|[\s\x22\x27/=\\])(?:\.env(?:\.(?:local|prod|production|dev|development|staging|test|ci))?|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc)(?:$|[\s\x22\x27|;&)<>])'
  read_filter_blocked:
    outcome: blocked
  env_dump:
    command_line|re: '(?:^|[;&\n]|\$\()\s{0,5}(?:\(\s{0,5})?(?:(?:/[\w./-]{0,60}/)?(?:env|printenv)|set|export(?:\s+-p)?|declare\s+-[px])\s{0,5}(?:$|[;&|>)\n]|[12]>)|\|\s{0,5}(?:/[\w./-]{0,60}/)?(?:env|printenv)\s{0,5}(?:$|[;&>\n]|[12]>)'
  env_dump_anycase:
    command_line|re|i: '(?:^|[;&\n]|\$\()\s{0,5}(?:\(\s{0,5})?(?:/[\w./-]{0,60}/)?(?:env|printenv)\s{0,5}(?:$|[;&|>)\n]|[12]>)'
  # cmd.exe `SET`: upper case alone, or any case behind `cmd /c`.
  env_dump_cmd:
    - command_line|re: '(?:^|[;&\n]|\$\()\s{0,5}SET\s{0,5}(?:$|[|\n])'
    - command_line|re|i: '(?:^|[\s;&|(`])cmd(?:\.exe)?\s{1,5}/[ck]\s{1,5}[\x22\x27]?set\s{0,5}(?:$|[|\n&>\x22\x27])'
  env_code:
    command_line|re: '(?:print|pprint|json\.dumps?|console\.(?:log|dir)|JSON\.stringify)\(\s{0,5}(?:dict\(\s{0,5})?(?:os\.environ|process\.env)(?:\.items\(\))?\s{0,5}[,)]'
  env_ps:
    command_line|re|i: '(?:^|[\s;&|(`])(?:get-childitem|gci|ls|dir|get-item)\s+(?:-path\s+)?env:\s{0,5}(?:$|[;&|)*])|\[environment\]::getenvironmentvariables\('
  env_cred_grep:
    command_line|re|i: '(?:^|[\s;&|(`])(?:env|printenv)\s{0,5}\|\s{0,5}(?:grep|rg|egrep)\s[^;&|\n]{0,80}(?:key|token|secret|passw|credential|anthropic|openai|aws_)'
  env_filter_grep:
    command_line|re|i: '(?:^|[\s;&|(`])(?:env|printenv)\s{0,5}\|\s{0,5}(?:grep|rg|egrep|fgrep)\s'
  cloud_selection:
    command_line|contains:
      - 'aws sts assume-role'
      - 'aws configure export-credentials'
      - 'aws configure get aws_secret_access_key'
      - 'aws sso get-role-credentials'
      - 'gcloud auth print-access-token'
      - 'gcloud auth print-identity-token'
      - 'gcloud auth application-default print-access-token'
      - 'az account get-access-token'
      - 'gh auth token'
      - 'get-azaccesstoken'
  condition: (read_file and not read_filter_nonsecret or read_cmd and (read_cmd_secret or not read_filter_nonsecret) or (1 of env_dump* and not env_filter_grep) or env_ps or env_cred_grep or env_code or cloud_selection) and not read_filter_blocked
level: informational
