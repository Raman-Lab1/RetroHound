title: Identity recon, then a secret read, then network egress
id: d42ad6fe-adb6-4543-956a-fc4ed2b3f10c
name: secrets_recon_read_egress
author: Raman Kumar
status: experimental
description: >-
  Within one session and one hour, in this order: the agent asks who and where it is (whoami, id, hostname, uname,
  groups, a bare env or printenv, aws sts get-caller-identity, gcloud auth list, az account show, gh auth status,
  kubectl auth whoami), then reads a secret file (secrets_read_for_egress), then sends data out
  (secrets_egress_call). This is the operator pattern of a hijacked agent: orient, harvest, exfiltrate. It is the same
  read and egress as secrets_read_then_egress with recon in front, so the two fire together; this one is the narrower
  lead.
tags:
  - attack.discovery
  - attack.credential_access
  - attack.exfiltration
  - attack.t1033
  - attack.t1082
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi03
  - owasp_agentic.asi10
correlation:
  type: temporal_ordered
  rules:
    - secrets_recon_command
    - secrets_read_for_egress
    - secrets_egress_call
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Debugging a deploy, where the agent checks the active identity, reads a key from .env and calls the API it belongs to
level: high
x-retrohound:
  lane: hunt
---
title: Helper, identity and host recon command
id: 449eb2c6-a88d-42da-bb08-fbfdec753469
name: secrets_recon_command
author: Raman Kumar
description: >-
  Silenced step one of secrets_recon_read_egress. Shell builtins count only in command position and with at most one
  short flag, so `id` in prose or `env FOO=1 cmd` is not matched; case-sensitive.
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_host:
    command_line|re: '(?:^|[;&|\n(`]|\$\()\s{0,5}(?:whoami|id|hostname|uname|groups|env|printenv)(?:\s{1,5}[-/][a-zA-Z]{1,6})?\s{0,5}(?:$|[;&|>)\n`])'
  selection_cloud:
    command_line|contains:
      - 'sts get-caller-identity'
      - 'gcloud auth list'
      - 'az account show'
      - 'gh auth status'
      - 'kubectl auth whoami'
      - 'get-stscalleridentity'
  condition: 1 of selection_*
level: informational
