title: Repeated secret-file read attempts after a block
id: 0ddd87c1-ccea-47e2-9a7a-c285d5b669ea
name: blocked_retry_secret_read
author: Raman Kumar
status: experimental
description: >-
  Claude Code's own guard (auto-mode classifier or a permission rule) blocked a secret-file read, and the agent tried
  again, and was blocked again, in the same session (any stream, main agent or sub-agent) within an hour, with the same
  tool or another one (Read, then `tail .env`, then `cat .env | sed ...`). User rejections and interrupts are not blocks: agents rephrase after those on purpose.
tags:
  - attack.credential_access
  - attack.defense_evasion
  - attack.t1552.001
  - attack.t1562
  - owasp_agentic.asi03
correlation:
  type: event_count
  rules:
    - blocked_secret_read_attempt
  group-by:
    - session_id
  timespan: 1h
  condition:
    gte: 2
falsepositives:
  - An agent asking for the same file twice because a rule was loosened between the attempts
level: medium
x-retrohound:
  lane: hunt
---
title: Helper, a secret-file read blocked by Claude Code
id: fca5dede-c605-41a9-8399-7f04f1f9d1a9
name: blocked_secret_read_attempt
author: Raman Kumar
description: Silenced step of blocked_retry_secret_read. Only automode-blocked and permission-rule denials count.
logsource:
  product: ai_coding_agent
detection:
  selection_read:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}[\s\x22\x27/\\=])?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  selection_blocked:
    outcome: blocked
    denial_kind:
      - automode-blocked
      - permission-rule
  filter_nonsecret:
    - command_line|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
    - target_path|re|i: *nonsecret
  condition: (selection_read or selection_cmd) and selection_blocked and not filter_nonsecret
level: informational
