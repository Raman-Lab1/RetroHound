title: Secret-file read blocked, then done with another kind of tool
id: 4b41ad61-4f9f-4084-af55-485cb1325747
name: blocked_then_other_tool_secret_read
author: Raman Kumar
status: experimental
description: >-
  Claude Code's own guard (auto-mode classifier or a permission rule) blocked a secret-file read, and within 15 minutes
  the same session read a secret file with another kind of tool, and it worked: a blocked Read, then a script that
  opens `.env` itself; a blocked `cat ~/.aws/credentials`, then Read or an MCP file tool. Read deny rules do not cover
  scripts that open files on their own, so this is the shape of working around the guard. Shell events have no
  target_path, so the two events are joined by session (main conversation and sub-agents together) and window, not by
  file. A second blocked attempt is blocked_retry_secret_read's case; a retry with the same kind of tool is left out.
tags:
  - attack.credential_access
  - attack.defense_evasion
  - attack.t1552.001
  - attack.t1562
  - owasp_agentic.asi02
  - owasp_agentic.asi03
references:
  - https://code.claude.com/docs/en/permissions
  - https://attack.mitre.org/techniques/T1552/001/
correlation:
  type: temporal_ordered
  rules:
    - blocked_secret_read_attempt
    - secret_read_succeeded
  group-by:
    - session_id
  timespan: 15m
falsepositives:
  - The user approved the read after the block (the Recently blocked list, or a loosened rule) and the agent used another tool
  - Two different secret files in one window, such as a blocked ~/.aws/credentials and then the project's own .env
level: medium
x-retrohound:
  lane: hunt
  differ_by:
    - category
---
title: Helper, a secret-file read that worked, by any tool but an @-mention
id: 36f8f303-f30a-4574-9aa4-9771ae7580ea
name: secret_read_succeeded
author: Raman Kumar
description: >-
  Silenced step two of blocked_then_other_tool_secret_read. Read, a shell reader, a script that names the file, or an MCP
  call whose input holds a secret-file path (match-only, so not on re-evaluation from the index). An @-mentioned file
  is the user's own choice and does not count.
logsource:
  product: ai_coding_agent
detection:
  selection_read:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}[\s\x22\x27/\\=])?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  selection_script:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:python[\d.]{0,5}|node|ruby|perl|php|bun|deno)\s[^;&|\n]{0,200}[\s\x22\x27/\\(](?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials)(?:$|[\s\x22\x27|;&)<>,])'
  selection_mcp:
    category: mcp
    tool_input|re|i: '[\x22/\\](?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]{1,2}id_[\w-]{1,40}|\.aws[\\/]{1,2}credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))\x22'
  selection_worked:
    outcome: success
  filter_mention:
    tool_name: '@file'
  filter_nonsecret:
    - command_line|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>,])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>,])'
    - target_path|re|i: *nonsecret
    - tool_input|re|i: *nonsecret
  condition: (selection_read or selection_cmd or selection_script or selection_mcp) and selection_worked and not filter_mention and not filter_nonsecret
level: informational
