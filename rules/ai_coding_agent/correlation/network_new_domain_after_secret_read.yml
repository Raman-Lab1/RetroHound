title: Secret-file read followed by a domain never seen before in the project
id: e1290e7f-e12c-488a-a217-9028744ba015
name: network_new_domain_after_secret_read
author: Raman Kumar
status: experimental
description: >-
  Within one session, a secret-file read (step one of secrets_read_then_egress) is followed within an hour by a web
  request or a command-line URL to a domain the project never contacted before, in all indexed history. A first-time
  destination right after a secret read is the shape of exfiltration to an attacker host; the project's known API
  hosts stay quiet once seen. Loopback and blocked calls are excluded. First-seen holds for any kind an event carries,
  so a known domain in a new hook command counts too. Needs 14 days of history (ADR 0016).
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552.001
  - attack.t1567
  - owasp_agentic.asi03
correlation:
  type: temporal_ordered
  rules:
    - secrets_read_for_egress
    - first_seen_domain_in_project
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Wiring up a new third-party API whose key sits in .env
level: medium
x-retrohound:
  lane: hunt
---
title: Helper, the first request to a domain in this project
id: 450abe9f-dec4-4bd9-bd5e-0286dd7430ca
name: first_seen_domain_in_project
author: Raman Kumar
description: >-
  Silenced step two of network_new_domain_after_secret_read. Runs on every category, since both web_request and
  process_creation carry `domain`.
logsource:
  product: ai_coding_agent
detection:
  selection:
    domain|exists: true
    first_seen_project: true
  filter_loopback:
    domain:
      - localhost
      - 127.0.0.1
      - '[::1]'
  filter_blocked:
    outcome: blocked
  condition: selection and not filter_loopback and not filter_blocked
level: informational
x-retrohound:
  requires:
    - first_seen
