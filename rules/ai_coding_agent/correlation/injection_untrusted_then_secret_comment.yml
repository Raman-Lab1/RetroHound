title: Untrusted content read, then a secret harvest and a post to GitHub through gh
id: 8c2f6e41-5d3a-4b97-a1e0-7f94c3d62b58
name: injection_untrusted_then_secret_comment
author: Raman Kumar
status: experimental
description: >-
  Within one session and thirty minutes of taking in content it did not write (untrusted_content_received: an issue,
  PR or release read through gh, a web page, an MCP result), the agent harvested a secret (secrets_harvest_for_recon:
  a secret file read, an environment dump or a cloud token print) and then wrote to GitHub through gh
  (github_post_via_gh: an issue or PR comment, a PR review, a POST or PATCH on issues, pulls or comments, a release
  with notes). This is the Comment-and-Control shape, where text in an issue or PR drives a CI agent to put a key into
  a comment that anyone can read. The post is a write to a public surface, so no network egress rule sees it.
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552
  - attack.t1567
  - owasp_agentic.asi01
  - owasp_agentic.asi03
correlation:
  type: temporal_ordered
  rules:
    - untrusted_content_received
    - secrets_harvest_for_recon
    - github_post_via_gh
  group-by:
    - session_id
  timespan: 30m
falsepositives:
  - A CI agent that reads an issue, runs `env` or reads a key to call the API under discussion, then comments the result
level: medium
x-retrohound:
  lane: hunt
---
title: Helper, a post to GitHub through gh
id: 3d9a7b52-e6c1-4f08-b2a4-91c5e8d70f36
name: github_post_via_gh
author: Raman Kumar
description: >-
  Silenced step three of injection_untrusted_then_secret_comment. gh issue comment, gh pr comment, gh pr review, gh api
  with -X POST or PATCH on an issues, pulls or comments path, gh api with -f, -F, --field, --raw-field or --input on
  such a path and no -X GET or HEAD (gh posts when it is given fields), and gh release create or edit with notes. A
  blocked or failed call published nothing.
logsource:
  product: ai_coding_agent
  category: process_creation
detection:
  selection_comment:
    command_line|re|i: '(?:^|[\s;&|(`])gh\s{1,5}(?:issue|pr)\s{1,5}(?:comment|review)\b'
  selection_api:
    command_line|re|i: '(?:^|[\s;&|(`])gh\s{1,5}api\s[^;&|\n]{0,300}(?:(?:-X|--method)[\s=]{1,3}(?:POST|PATCH)\b[^;&|\n]{0,300}(?:issues|pulls|comments)|(?:issues|pulls|comments)[^;&|\n]{0,300}(?:-X|--method)[\s=]{1,3}(?:POST|PATCH)\b)'
  api_field:
    command_line|re|i: '(?:^|[\s;&|(`])gh\s{1,5}api\b[^;&|\n]{0,300}(?:\s(?:-[fF][\s=\w]|--(?:raw-field|field|input)[\s=])[^;&|\n]{0,300}/(?:issues|pulls|comments)\b|/(?:issues|pulls|comments)\b[^;&|\n]{0,300}\s(?:-[fF][\s=\w]|--(?:raw-field|field|input)[\s=]))'
  # Not tied to the same command as api_field: `gh api x -X GET; gh api .../comments -f body=y` is missed.
  filter_api_get:
    command_line|re|i: '(?:^|[\s;&|(`])gh\s{1,5}api\b[^;&|\n]{0,300}\s(?:-X\s{0,3}|--method[\s=]{1,3})(?:GET|HEAD)\b'
  selection_release:
    command_line|re|i: '(?:^|[\s;&|(`])gh\s{1,5}release\s{1,5}(?:create|edit)\b[^;&|\n]{0,400}\s(?:-n|--notes|-F|--notes-file)\b'
  filter_failed:
    outcome:
      - blocked
      - error
  condition: (1 of selection_* or api_field and not filter_api_get) and not filter_failed
level: informational
