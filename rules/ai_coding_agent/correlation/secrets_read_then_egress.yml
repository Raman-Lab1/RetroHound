title: Secret file read followed by network egress
id: 6f1ec97a-1454-42e0-822a-18eda9351b32
name: secrets_read_then_egress
author: Raman Kumar
status: experimental
description: >-
  Within one session, a secret-file read is followed (or accompanied, as in `cat .env; curl ...`) by network egress
  within an hour. Egress means WebFetch or an MCP call with a URL, curl, wget, nc, scp, rsync, ssh, git push, npm
  publish or PowerShell web cmdlets. The main agent and its sub-agents count as one session, so a parent read and a
  child egress are joined (ordered by timestamp).
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi03
correlation:
  type: temporal_ordered
  rules:
    - secrets_read_for_egress
    - secrets_egress_call
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Reading an API key from .env to call that API's own endpoint (seen on real history); still worth a look
  - Deploy flows that read a key then git push
level: high
x-retrohound:
  lane: hunt
---
title: Helper, secret read that was not blocked
id: f0485590-c98e-4c32-b41e-890d780d4e85
name: secrets_read_for_egress
author: Raman Kumar
description: Silenced step one of secrets_read_then_egress.
logsource:
  product: ai_coding_agent
detection:
  selection_read:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}(?:[\s\x22\x27/=]|[\w.:~}%)]\\))?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  filter_nonsecret:
    - command_line|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
    - target_path|re|i: *nonsecret
  # A real secret named next to a sample (`cat .env .env.example`) keeps the read: the filter is per command line.
  selection_cmd_secret:
    command_line|re|i: '(?:^|[\s\x22\x27/=\\])(?:\.env(?:\.(?:local|prod|production|dev|development|staging|test|ci))?|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc)(?:$|[\s\x22\x27|;&)<>])'
  filter_blocked:
    outcome: blocked
  condition: (selection_read and not filter_nonsecret or selection_cmd and (selection_cmd_secret or not filter_nonsecret)) and not filter_blocked
level: informational
---
title: Helper, network egress call that was not blocked
id: 6e78a371-29da-4d27-bdee-4b807cc2c725
name: secrets_egress_call
author: Raman Kumar
description: Silenced step two of secrets_read_then_egress. Loopback-only calls are excluded.
logsource:
  product: ai_coding_agent
detection:
  selection_web:
    category: web_request
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:curl|wget|nc|ncat|netcat|socat|scp|sftp|rsync|ftp|telnet|ssh|invoke-webrequest|invoke-restmethod|iwr|irm|git\s+push|npm\s+publish)(?:\s|$)'
  # Loopback means the request host itself: a WebFetch/MCP domain, or a curl/wget line that names a loopback host as an
  # argument (not a `Host:` header value or a `#127.0.0.1` fragment) and no other host, proxy or config file. Other
  # flags, pipes and redirects do not matter.
  # ponytail: a bare one-dot remote host (`example.invalid`, no scheme, port or path) next to a loopback URL still reads
  # as loopback; a real argv parser would close that.
  filter_loopback_web:
    category: web_request
    domain:
      - localhost
      - 127.0.0.1
      - '[::1]'
  filter_loopback_cmd:
    command_line_unquoted|re|i|all:
      - '(?:^|[\s;&|(`])(?:curl|wget)\s'
      - '(?:https?://|^|[^:\s]\s{1,5}|=)(?:localhost|127\.0\.0\.1|\[::1\])(?::\d{1,5})?(?:[/?#\s]|$)'
      # Every `://` in the line is followed by a loopback host (so `http://localhost@x` and `127.0.0.1.x` are not).
      - '^(?:[^:]|:[^/]|:/[^/]|:/?$|://(?:localhost|127\.0\.0\.1|\[::1\])(?::\d{1,5})?(?:[/?#\s]|$))*$'
  # Any other host in the line: a bare name with `:port`, a path or two dots, an IPv4 address outside 127/8, or
  # traffic sent through a proxy or a config file.
  filter_remote_host:
    - command_line_unquoted|re|i:
        - '(?:^|[\s=@])[\w-]{1,63}(?:\.[\w-]{1,63}){0,9}\.[a-z][\w-]{0,62}(?::\d{1,5}|/)'
        - '(?:^|[\s=@])[\w-]{1,63}(?:\.[\w-]{1,63}){1,9}\.[a-z][\w-]{0,62}(?:\s|$)'
        - '(?:^|[\s=@])(?:\d{1,2}|1[013-9]\d|12[0-689]|[02-9]\d\d)(?:\.\d{1,3}){3}(?::\d|/|\s|$)'
    # Case-sensitive: `-x` is a proxy, `-X POST` is not.
    - command_line_unquoted|re: '(?:^|\s)(?:-[a-zA-Z]{0,10}[xK]|--(?:proxy|preproxy|socks[\w-]{0,10}|config|connect-to|resolve)\b)|_(?:proxy|PROXY)='
  # A second egress command in the line may go anywhere.
  filter_two_egress:
    command_line|re|i: '(?:^|[\s;&|(`])(?:curl|wget|nc|ncat|netcat|socat|scp|sftp|rsync|ftp|telnet|ssh|invoke-webrequest|invoke-restmethod|iwr|irm|git\s+push|npm\s+publish)(?:\s|$)[\s\S]{0,8000}(?:^|[\s;&|(`])(?:curl|wget|nc|ncat|netcat|socat|scp|sftp|rsync|ftp|telnet|ssh|invoke-webrequest|invoke-restmethod|iwr|irm|git\s+push|npm\s+publish)(?:\s|$)'
  filter_blocked:
    outcome: blocked
  condition: (selection_web or selection_cmd) and not (filter_loopback_web or filter_loopback_cmd and not filter_remote_host and not filter_two_egress) and not filter_blocked
level: informational
