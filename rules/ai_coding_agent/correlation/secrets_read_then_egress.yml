title: Secret file read followed by network egress
id: 6f1ec97a-1454-42e0-822a-18eda9351b32
name: secrets_read_then_egress
author: Raman Kumar
status: experimental
description: >-
  Within one session, a secret-file read is followed (or accompanied, as in `cat .env; curl ...`) by network egress
  within an hour. Egress means WebFetch or an MCP call with a URL, curl, wget, nc, scp, rsync, ssh, git push, npm
  publish or PowerShell web cmdlets. The main agent and its sub-agents count as one session, so a parent read and a
  child egress are joined (ordered by timestamp).
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi03
correlation:
  type: temporal_ordered
  rules:
    - secrets_read_for_egress
    - secrets_egress_call
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Reading an API key from .env to call that API's own endpoint (seen on real history); still worth a look
  - Deploy flows that read a key then git push
level: high
x-retrohound:
  lane: hunt
---
title: Helper, secret read that was not blocked
id: f0485590-c98e-4c32-b41e-890d780d4e85
name: secrets_read_for_egress
author: Raman Kumar
description: Silenced step one of secrets_read_then_egress.
logsource:
  product: ai_coding_agent
detection:
  selection_read:
    category: file_access
    target_path|re|i: '(?:^|/)\.env(?:\.[\w-]{1,30}){0,3}$|/\.ssh/id_[\w-]{1,40}$|/\.aws/credentials$|/\.(?:npmrc|pypirc|netrc)$|\.(?:pem|p12|pfx)$'
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|sed|awk|cut|type|bat|strings|xxd|od|nl|tac|get-content|gc|select-string|sls)\s(?:[^;&|\n]{0,200}(?:[\s\x22\x27/=]|[\w.:~}%)]\\))?(?:\.env(?:\.[\w-]{1,30}){0,3}|\.ssh[\\/]id_[\w-]{1,40}|\.aws[\\/]credentials|\.npmrc|\.pypirc|\.netrc|[\w.-]{1,60}\.(?:pem|p12|pfx))(?:$|[\s\x22\x27|;&)<>])'
  filter_nonsecret:
    - command_line|re|i: &nonsecret '\.(?:example|sample|template|dist|defaults|schema)(?:$|[\s\x22\x27|;&)<>])|(?:ca|cert|chain|bundle|root|pub)\.pem(?:$|[\s\x22\x27|;&)<>])'
    - target_path|re|i: *nonsecret
  filter_blocked:
    outcome: blocked
  condition: (selection_read or selection_cmd) and not filter_nonsecret and not filter_blocked
level: informational
---
title: Helper, network egress call that was not blocked
id: 6e78a371-29da-4d27-bdee-4b807cc2c725
name: secrets_egress_call
author: Raman Kumar
description: Silenced step two of secrets_read_then_egress. Loopback-only calls are excluded.
logsource:
  product: ai_coding_agent
detection:
  selection_web:
    category: web_request
  selection_cmd:
    category: process_creation
    command_line|re|i: '(?:^|[\s;&|(`])(?:curl|wget|nc|ncat|netcat|socat|scp|sftp|rsync|ftp|telnet|ssh|invoke-webrequest|invoke-restmethod|iwr|irm|git\s+push|npm\s+publish)(?:\s|$)'
  filter_loopback:
    - domain:
        - localhost
        - 127.0.0.1
        - '[::1]'
    - command_line|contains:
        - localhost
        - 127.0.0.1
  filter_blocked:
    outcome: blocked
  condition: (selection_web or selection_cmd) and not filter_loopback and not filter_blocked
level: informational
