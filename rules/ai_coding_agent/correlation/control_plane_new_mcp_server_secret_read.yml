title: MCP server never seen before, and a secret-file read in the same session
id: 0d50a739-542b-4786-969d-e11ce01ee351
name: control_plane_new_mcp_server_secret_read
author: Raman Kumar
status: experimental
description: >-
  Within one session and one hour, in either order, the agent called an MCP server for the first time in all indexed
  history and read a secret file (step one of secrets_read_then_egress). A poisoned or newly installed server is the
  usual way a secret leaves through a tool argument. Only `mcp` category calls count, so a server whose first call
  carries a URL (a web_request) is missed. First-seen holds for any kind an event carries: a known server called under
  a new skill counts as new too. Needs 14 days of history (ADR 0016).
tags:
  - attack.credential_access
  - attack.initial_access
  - attack.t1552.001
  - attack.t1195.002
  - owasp_agentic.asi03
  - owasp_agentic.asi04
correlation:
  type: temporal
  rules:
    - first_seen_mcp_server
    - secrets_read_for_egress
  group-by:
    - session_id
  timespan: 1h
falsepositives:
  - Trying out a new MCP server while working on a project whose .env the agent reads anyway
level: medium
x-retrohound:
  lane: hunt
---
title: Helper, the first call to an MCP server in all history
id: 9f87c810-0caa-4ab2-8daa-00bb4f93c9e2
name: first_seen_mcp_server
author: Raman Kumar
description: Silenced step of control_plane_new_mcp_server_secret_read and control_plane_new_mcp_server_egress.
logsource:
  product: ai_coding_agent
  category: mcp
detection:
  selection:
    mcp_server|exists: true
    first_seen_global: true
  condition: selection
level: informational
x-retrohound:
  requires:
    - first_seen
