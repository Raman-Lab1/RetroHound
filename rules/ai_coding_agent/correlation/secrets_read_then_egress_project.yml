title: Secret file read and network egress in different sessions of one project
id: 2b7d1c64-5e0a-4f4e-9a53-3c1f8d6a7e90
name: secrets_read_then_egress_project
author: Raman Kumar
status: experimental
description: >-
  A secret-file read in one session is followed by network egress in a different session of the same project within
  10 minutes. This is the nested agent CLI case (`claude -p`, `codex exec`): the child has its own session_id, so
  secrets_read_then_egress never joins it with the parent. Same-session pairs are left to that rule (differ_by
  session_id), so the two do not duplicate. Sessions are joined by project_path only, so two unrelated agents working
  in the same directory also match; hunt lane only.
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552
  - attack.t1041
  - owasp_agentic.asi03
  - owasp_agentic.asi07
correlation:
  type: temporal_ordered
  rules:
    - secrets_read_for_egress
    - secrets_egress_call
  group-by:
    - project_path
  timespan: 10m
falsepositives:
  - Two unrelated agent sessions open in the same project directory
  - A deploy session started right after another session read a key
level: medium
x-retrohound:
  lane: hunt
  differ_by:
    - session_id
