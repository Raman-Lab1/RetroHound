name: secrets_cloud_metadata_web
author: Raman Kumar
id: 0039311c-bee1-41d2-9167-6343bce9e150
title: Web request to the cloud instance metadata service
status: experimental
description: >
  WebFetch or an MCP call with a URL whose host is the instance metadata service (169.254.169.254,
  [fd00:ec2::254], metadata.google.internal) or the ECS task-credential endpoint 169.254.170.2. On a cloud host this
  hands out the instance role's temporary credentials. Shell commands are secrets_cloud_metadata.
level: medium
tags: [attack.credential_access, attack.t1552.005, owasp_agentic.asi03]
falsepositives:
  - Agent working on a cloud VM that reads the instance id or region on purpose.
x-retrohound: { lane: hunt }
logsource: { product: ai_coding_agent, category: web_request }
detection:
  selection:
    domain:
      - '169.254.169.254'
      - '169.254.170.2'
      - '[fd00:ec2::254]'
      - 'metadata.google.internal'
  condition: selection
